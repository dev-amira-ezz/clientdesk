<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Client Desk</title>
  </head>
  <body>
    <header>
      <h1>Client Desk</h1>
      <p>
        This platform is designed to retrieve and calculate our customers' data
      </p>
    </header>
    <main>
      <section id="search">
        <input
          type="search"
          name="search-input"
          id="search-input"
          placeholder="Search for customer name"
        />
        <button type="button" id="search-button">Search Customers</button>
      </section>
      <section>
        <table>
          <caption>
            Customers Data Table
          </caption>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Country</th>
              <th scope="col">Plan</th>
              <th scope="col">Monthly Fees</th>
            </tr>
          </thead>
          <tbody id="customer-container"></tbody>
          <tfoot>
            <tr>
              <td colspan="3">Number of Pro Customers</td>
              <td id="pro-count"></td>
            </tr>
            <tr>
              <td colspan="3">Total Monthly Revenue</td>
              <td id="monthly-revenue"></td>
            </tr>
          </tfoot>
        </table>
        <p id="app-messages"></p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
